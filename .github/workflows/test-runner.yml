name: Wazuh GitHub Runner Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  wazuh-test:
    runs-on: [self-hosted, wazuh, github, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "=================================="
          echo "WAZUH GITHUB RUNNER"
          echo "=================================="
          echo "Hostname:"
          hostname

          echo "OS:"
          uname -a

          echo "User:"
          whoami

          echo "Working directory:"
          pwd

      - name: Test Docker
        run: |
          docker --version

      - name: Security test
        run: |
          echo "Security pipeline is working"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"
