name: Wazuh GitHub Events

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  wazuh-event:
    runs-on: [self-hosted, wazuh, github, security]

    steps:
      - name: Send GitHub event to Wazuh
        shell: bash
        run: |
          LOG="/home/ade/cobagithub/_diag/github-events.log"

          EVENT_TIME="$(date '+%Y-%m-%d %H:%M:%S')"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "$EVENT_TIME WAZUH_GITHUB_EVENT type=commit repo=${{ github.repository }} branch=${{ github.ref_name }} sha=${{ github.sha }} actor=${{ github.actor }}" >> "$LOG"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "$EVENT_TIME WAZUH_GITHUB_EVENT type=pull_request action=${{ github.event.action }} repo=${{ github.repository }} pr=${{ github.event.pull_request.number }} title=\"${{ github.event.pull_request.title }}\" sha=${{ github.event.pull_request.head.sha }} actor=${{ github.actor }} base=${{ github.event.pull_request.base.ref }} head=${{ github.event.pull_request.head.ref }}" >> "$LOG"
          fi
